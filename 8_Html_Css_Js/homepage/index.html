<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Home page</title>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link href="home_desktop.css" media='only screen and (min-width:600px)' rel="stylesheet">
        <!-- <link href="home_tablet.css" media='only screen and (min-width:1100px) and (max-width:1169px)' rel="stylesheet"> -->
        <!-- <link href="home_mobile.css" media='only screen and (min-width:600px) and (max-width:600)' rel="stylesheet"> -->

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
        <script src="src/warp_drive.js"></script>

        <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js'></script>
        <script src='https://cdnjs.cloudflare.com/ajax/libs/ismobilejs/0.4.1/isMobile.min.js'></script>
    </head>
    <body>
        <!-- Create a full width container, spanning the entire width of the viewport screen limit -->
        <div id='box-space-fabric' class='container-fluid'>
            <div id='box-centered-flex' class='container'>
                <div id="box-profile-picture">
                    <div id="cell-img-top-left" class='grid-cell top left'>
                        <div id='effect-top-left' class='container'>
                            <!-- these effect containers help keep control over cell-img-center-center -->
                        </div>
                    </div>
                    <div id="cell-img-top-center" class='grid-cell top center'>
                        <div id='effect-top-center' class='container'>
                            <!-- these effect containers help keep control over cell-img-center-center -->
                        </div>
                    </div>
                    <div id="cell-img-top-right" class='grid-cell top right'>
                        <div id='effect-top-right' class='container'>
                            <!-- these effect containers help keep control over cell-img-center-center -->
                        </div>
                    </div>
                    <div id="cell-img-center-left" class='grid-cell center left'>
                        <div id='effect-center-left' class='container'>
                            <!-- these effect containers help keep control over cell-img-center-center -->
                        </div>
                    </div>
                    <div id="cell-img-center-center" class='grid-cell center center'>
                        <div id="profile-picture">
                            <img src="./images/profile_picture.png" alt="Profile Picture" />
                        </div>
                    </div>
                    <div id="cell-img-center-right" class='grid-cell center right'>
                        <div id='box-warp-drive' class='container'>
                        </div>
                        <div id='effect-center-right' class='container'>
                            <!-- these effect containers help keep control over cell-img-center-center -->
                        </div>
                    </div>
                    <div id="cell-img-bottom-left" class='grid-cell bottom left'>
                        <div id='effect-bottom-left' class='container'>
                            <!-- these effect containers help keep control over cell-img-center-center -->
                        </div>
                    </div>
                    <div id="cell-img-bottom-center" class='grid-cell bottom center'>
                        <div id='effect-bottom-center' class='container'>
                            <!-- these effect containers help keep control over cell-img-center-center -->
                        </div>
                    </div>
                    <div id="cell-img-bottom-right" class='grid-cell bottom right'>
                        <div id='effect-bottom-right' class='container'>
                            <!-- these effect containers help keep control over cell-img-center-center -->
                        </div>
                    </div>
                </div>
                <div id="box-profile-text">
                    <h5 id="profile-name">Gabriel R. Emegildio</h5>
                    <p id="profile-description">
                        Hi! I'm 34 years old, brazilian, living in São Paulo.
                    </p>
                    <p id="width"></p>
                    <p id="height"></p>
                </div>
                <!-- Create a centralized navigation bar -->
                <nav class="navbar navbar-sm">
                    <div class="container-fluid justify-content-center">
                        <ul class="navbar-nav align-items-center">
                            <!-- Links -->
                            <li class="nav-item">
                                <a class="nav-link" href="profiles/personal/personal.html">Personal profile</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="profiles/professional/professional.html">Professional profile</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="profiles/about/about.html">About this website</a>
                            </li>
                        </ul>
                    </div>
                </nav>
            </div>
        </div>
    </body>
</html>
